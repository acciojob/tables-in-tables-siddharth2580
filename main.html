<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table style="width: 100%; height: 100%">
      <table style="width: 100%; height: 100%; border-collapse: collapse;" border="1">
    <tr>
        <!-- Top Left: Nested Table 2 -->
        <td style="vertical-align: top; padding: 10px;">
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>
                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>
                </tbody>
            </table>
        </td>

        <!-- Top Right: Nested Table 1 with list -->
        <td style="vertical-align: top; padding: 10px;">
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr>
                        <th>Nested Table 1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left; padding-left: 20px;">
                            <ul>
                                <li>List item</li>
                                <li>List item</li>
                                <li>List item</li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
    <tr>
        <!-- Bottom Left: Nested Table 3 -->
        <td style="vertical-align: top; padding: 10px;">
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="color: purple;">Nested Table</td>
                        <td>Demo Continued</td>
                    </tr>
                </tbody>
            </table>
        </td>

        <!-- Bottom Right: Nested Table 4 -->
        <td style="vertical-align: top; padding: 10px;">
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr>
                        <th>Nested Table 4</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="background-color: black; color: white; font-weight: bold;">HTML</td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
</table>
    </table>
  </body>
</html>
